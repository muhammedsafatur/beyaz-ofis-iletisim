openapi: 3.0.3
info:
  title: Kurum İçi İletişim API
  version: 1.0.0
  description: |
    MVP (Faz 1) API sözleşmesi. Doküman sürümü: kurum-ici-iletisim-spec-v0.7.md (Ç2).
    Yetki kontrolü her istekte sunucuda yapılır. İstemci yetkiye güvenmez.
    Hata formatı: { error: { code, message } }. Kodlar kapalı katalogdur (K6), bkz. components.schemas.Error.
servers:
  - url: https://api.example.internal/api/v1
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Organization
  - name: Conversations
  - name: Messages
  - name: Tickets
  - name: AccessRequests
  - name: Admin

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: Giriş
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Başarılı giriş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access token yenile, refresh token döner (rotation). Rotate edilmiş token tekrar gelirse aile iptal edilir (REFRESH_TOKEN_REUSED).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Yeni token çifti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Bu oturumu kapat. Yalnızca gönderilen refresh token'ın ailesi kapanır (B4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Kapatıldı }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Tüm cihazlardan çıkış. Kullanıcının tüm refresh token aileleri kapanır (B4).
      responses:
        '204': { description: Kapatıldı }

  /auth/accept-invite:
    post:
      tags: [Auth]
      summary: Davet token'ı ile parola belirle. Token tek kullanımlık ve süreli (Ç16).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '204': { description: Parola belirlendi, hesap aktif }
        '400':
          description: Davet geçersiz, kullanılmış ya da süresi dolmuş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me:
    get:
      tags: [Users]
      summary: Kendi profilim
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      tags: [Users]
      summary: Profil güncelle. Yalnızca unvan ve profil fotoğrafı. Ad soyad yalnızca sistem yöneticisi tarafından değişir (Ç17).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job_title: { type: string, maxLength: 120 }
                profile_picture_url: { type: string, format: uri, nullable: true }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /users:
    get:
      tags: [Users]
      summary: Kullanıcı ara (kişi listesi)
      parameters:
        - { name: company_id, in: query, schema: { type: integer } }
        - { name: department_id, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Kullanıcı listesi
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
                  next_cursor: { type: string, nullable: true }

  /companies:
    get:
      tags: [Organization]
      summary: Şirket listesi
      responses:
        '200':
          description: Şirketler
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Company' }

  /departments:
    get:
      tags: [Organization]
      summary: Birim listesi
      parameters:
        - { name: company_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Birimler
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }

  /locations:
    get:
      tags: [Organization]
      summary: Lokasyon listesi
      responses:
        '200':
          description: Lokasyonlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }

  /conversations:
    get:
      tags: [Conversations]
      summary: Konuşma listesi (son mesaj tarihine göre sıralı, okunmamış sayısı dahil)
      description: |
        updated_after verilirse yalnızca bu andan sonra güncellenen konuşmalar döner (K4 delta).
        Okundu ve üyelik olayları da updated_at değerini günceller.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: updated_after, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Konuşmalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationSummary' }
                  next_cursor: { type: string, nullable: true }
    post:
      tags: [Conversations]
      summary: Konuşma oluştur (birebir, grup)
      description: |
        Birebir konuşma için canMessage kontrolü yapılır. Aynı çift ve bağlam için aktif konuşma varsa o döner (200), yoksa oluşturulur (201). Ç24.
        Grup oluşturma: her aktif çalışan (Ç7). Eklenen her üye için canMessage geçmelidir.
        Şirketler arası ise company_context_id seçimi zorunludur ya da tek bağlantı otomatik seçilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, member_ids]
              properties:
                type: { type: string, enum: [direct, group] }
                name: { type: string, maxLength: 120, description: Yalnızca grup için }
                member_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                company_context_id: { type: integer, nullable: true }
      responses:
        '200':
          description: Birebir konuşma zaten var, mevcut konuşma döner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Şirketler arası bağlam seçimi gerekli
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextChoiceRequired' }

  /conversations/{conversationId}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      tags: [Conversations]
      summary: Konuşma detayı (yalnızca aktif üye)
      responses:
        '200':
          description: Konuşma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversationId}/members:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    post:
      tags: [Conversations]
      summary: "Üye ekle. Grupta grup kurucusu, birim kanalında birim yöneticisi (Ç8)."
      description: Eklenen her üye için canMessage(ekleyen, üye) geçmelidir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Üyeler eklendi, sistem mesajı oluştu }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Kişi bu konuşmada zaten aktif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/{conversationId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Conversations]
      summary: "Üyeyi çıkar (sistem mesajı oluşur, mesajlar silinmez). Yetki: grup kurucusu ya da birim kanalında birim yöneticisi (Ç8)."
      responses:
        '204': { description: Çıkarıldı }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{conversationId}/read:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    post:
      tags: [Conversations]
      summary: Okundu olarak işaretle (last_read_at güncellenir). Gövdesiz (K2 açık notu).
      responses:
        '204': { description: İşaretlendi }

  /conversations/{conversationId}/mute:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    patch:
      tags: [Conversations]
      summary: Sessize al / aç (yalnızca kendi üyeliğim)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_muted]
              properties:
                is_muted: { type: boolean }
      responses:
        '200': { description: Güncellendi }

  /conversations/{conversationId}/messages:
    parameters:
      - { $ref: '#/components/parameters/ConversationId' }
    get:
      tags: [Messages]
      summary: Mesaj listesi (before_seq ile geriye, after_seq ile yeni mesajlar, after_change_seq ile değişenler)
      parameters:
        - { name: before_seq, in: query, schema: { type: integer, format: int64 } }
        - { name: after_seq, in: query, schema: { type: integer, format: int64 } }
        - { name: after_change_seq, in: query, description: 'Yeni, düzenlenmiş ve silinmiş mesajları change_seq sırasıyla döner (K4)', schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      description: |
        before_seq, after_seq ve after_change_seq birlikte kullanılamaz.
        Hiçbiri yoksa en yeni limit mesaj döner (Ç23).
        Delta polling istemcisi after_change_seq ile son gördüğü change_seq değerinden devam eder.
      responses:
        '200':
          description: Mesajlar, seq'e göre sıralı
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Messages]
      summary: Mesaj gönder (idempotent)
      description: Aynı client_message_id ile tekrar gelen istek, ilk mesajın sonucunu döner. Hız sınırı 60/dakika (K7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, content]
              properties:
                client_message_id: { type: string, format: uuid }
                content: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '200':
          description: Daha önce kaydedilmiş (idempotent tekrar)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /messages/{messageId}:
    parameters:
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Messages]
      summary: Düzenle (yalnızca gönderen, gönderimden sonra 15 dk)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: Düzenlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Düzenleme penceresi kapandı ya da mesaj silinmiş
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Messages]
      summary: Sil (yalnızca gönderen, gönderimden sonra 15 dk). Alıcıda "mesaj silindi" görünür.
      responses:
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Silme penceresi kapandı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /messages/can-send:
    post:
      tags: [Messages]
      summary: Gönderme yetkisi ön kontrolü (yalnızca UX, kesin karar sunucuda)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id: { type: string, format: uuid }
                company_context_id: { type: integer, nullable: true }
      responses:
        '200':
          description: Sonuç
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reason: { type: string, nullable: true, description: Kısa, kullanıcıya gösterilebilir neden }
                  context_options:
                    type: array
                    items: { type: integer }
                    description: Şirketler arası ise seçilebilecek bağlamlar

  /tickets:
    get:
      tags: [Tickets]
      summary: Ticket listesi
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [requester, approver] }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, withdrawn, expired] } }
        - { name: cursor, in: query, schema: { type: string } }
      description: |
        approver: patronun karar verebileceği ticketlar (kurum genelinde açık ticketlar). Birim yöneticisi approver değildir.
        Patron yokken sistem yöneticisi için approver rolü yalnızca meta veriyle karar verilecek ticketları listeler.
      responses:
        '200':
          description: Ticketlar
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TicketSummary' }
                  next_cursor: { type: string, nullable: true }
    post:
      tags: [Tickets]
      summary: Ticket aç (idempotent, client_request_id ile). Hız sınırı 20/saat (K7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, target_department_id, title, body]
              properties:
                client_request_id: { type: string, format: uuid, description: İstemci üretir (Ç25) }
                target_department_id: { type: integer }
                title: { type: string, minLength: 3, maxLength: 160 }
                body: { type: string, minLength: 10, maxLength: 8000 }
      responses:
        '201':
          description: Açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '200':
          description: Aynı client_request_id ile daha önce açılmış, mevcut ticket döner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tickets/{ticketId}:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    get:
      tags: [Tickets]
      summary: Ticket detayı. Gövde talep eden ve patrona döner, diğerlerine null (Ç11).
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      summary: "Ticket düzenle. Yalnızca talep eden, karar verilmeden önce ve açıldıktan sonra 15 dk içinde (Ç12). Önceki hal ticket_revisions'a yazılır (B5)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 3, maxLength: 160 }
                body: { type: string, minLength: 10, maxLength: 8000 }
      responses:
        '200':
          description: Düzenlendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{ticketId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Tickets]
      summary: Ticket'ı geri çek (yalnızca talep eden, karar verilmeden önce)
      responses:
        '200':
          description: Geri çekildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{ticketId}/reopen:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Tickets]
      summary: Süresi dolmuş (expired) ticket'ı yeniden aç (yalnızca talep eden). Yeni kayıt reopened_from ile bağlanır (Ç14).
      responses:
        '201':
          description: Yeni ticket oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tickets/{ticketId}/decision:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Tickets]
      summary: Ticket kararı (patron; patron yoksa sistem yöneticisi meta veriyle). Ticket başına tek karar (K5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Karar kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403':
          description: Talep eden kendi ticket'ını onaylayamaz ya da yetkisiz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  /access-requests:
    get:
      tags: [AccessRequests]
      summary: Erişim talepleri
      parameters:
        - name: role
          in: query
          required: true
          schema: { type: string, enum: [requester, approver] }
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, withdrawn, expired] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Talepler. Approver görünümünde yalnızca meta veri döner.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessRequestSummary' }
                  next_cursor: { type: string, nullable: true }
    post:
      tags: [AccessRequests]
      summary: Erişim talebi oluştur (idempotent, client_request_id ile)
      description: |
        target_department_ids yalnızca konuşmadaki üyelerin birimleriyle sınırlıdır. Ayrılmış üyelerin birimleri de hedef olabilir (Ç10).
        Her hedef için ayrı karar kaydı oluşur. Talep sunucuda expires_at (varsayılan 72 saat) ile açılır.
        Gerekçe en az 20 karakterdir (Ç26).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id, conversation_id, reason, target_department_ids]
              properties:
                client_request_id: { type: string, format: uuid, description: İstemci üretir (Ç25) }
                conversation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 20, maxLength: 1000 }
                target_department_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '200':
          description: Aynı client_request_id ile daha önce açılmış, mevcut talep döner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Hedef birim konuşmada yok ya da gerekçe yetersiz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /access-requests/{requestId}:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
    get:
      tags: [AccessRequests]
      summary: Talep detayı (yalnızca meta veri). İçerik ayrı endpoint'lerde döner.
      responses:
        '200':
          description: Talep detayı (meta veri)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /access-requests/{requestId}/targets/{departmentId}/decision:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { name: departmentId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [AccessRequests]
      summary: Hedef kararı (patron; patron yoksa sistem yöneticisi meta veriyle). Birim yöneticisi karar veremez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Karar kaydedildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '403':
          description: Talep eden kendi talebini onaylayamaz ya da yetkisiz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/Conflict' }

  /access-requests/{requestId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
    post:
      tags: [AccessRequests]
      summary: Talebi geri çek (yalnızca talep eden, karar kapanmadan)
      responses:
        '200':
          description: Geri çekildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /access-requests/{requestId}/reopen:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
    post:
      tags: [AccessRequests]
      summary: Süresi dolmuş (expired) talebi yeniden aç (yalnızca talep eden). Yeni kayıt reopened_from ile bağlanır (Ç14).
      responses:
        '201':
          description: Yeni talep oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /access-requests/{requestId}/events:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
    post:
      tags: [AccessRequests]
      summary: "İstemci olayı bildirir (Ç15). Kayıt istemci beyanıdır, sahte ya da eksik olabilir. İstemci başına hız sınırı uygulanır."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [copy_blocked] }
      responses:
        '204': { description: Kaydedildi (access_log) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /access-requests/{requestId}/content:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
    get:
      tags: [AccessRequests]
      summary: Onaylı talepte içerik (yalnızca talep eden, access_expires_at süresince, her çağrı access_log'a yazılır)
      responses:
        '200':
          description: Mesajlar, kopyalama kapalı
          headers:
            Cache-Control:
              schema: { type: string, example: 'no-store' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  access_expires_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: Erişim süresi doldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /access-requests/{requestId}/targets/{departmentId}/content:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { name: departmentId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [AccessRequests]
      summary: Patron karar öncesi içeriği okur (K3). Yalnızca patron, hedef pending iken. Her çağrı access_log'a yazılır.
      description: |
        "Yönetici" burada patrondur. Birim yöneticisi ve sistem yöneticisi bu uca erişemez (sistem yöneticisi yalnızca meta veri görür).
        Patron yoksa içerik açılmaz. Kapsam: konuşmanın tamamı görünür.
      responses:
        '200':
          description: Mesajlar, kopyalama kapalı
          headers:
            Cache-Control:
              schema: { type: string, example: 'no-store' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more: { type: boolean }
        '403':
          description: Patron değil ya da hedef artık pending değil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    post:
      tags: [Admin]
      summary: Kullanıcı oluştur (sistem yöneticisi). Davet e-postası gönderilir, parola davet ile belirlenir (Ç16).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email]
              properties:
                first_name: { type: string, maxLength: 80 }
                last_name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                job_title: { type: string, maxLength: 120 }
                department_ids:
                  type: array
                  items: { type: integer }
                location_ids:
                  type: array
                  items: { type: integer }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin]
      summary: Kullanıcı güncelle (ad soyad, unvan, birim ve lokasyon). Birimler user_departments, lokasyonlar user_locations tablosuna yazılır (Ç18).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 80 }
                last_name: { type: string, maxLength: 80 }
                job_title: { type: string, maxLength: 120 }
                department_ids:
                  type: array
                  items: { type: integer }
                location_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}/deactivate:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      summary: Pasifleştir. Tüm aktif konuşmalardan çıkarılır, refresh token aileleri kapanır, sistem mesajı oluşur.
      responses:
        '200':
          description: Pasifleştirildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}/activate:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      summary: Yeniden aktif et. Konuşmalara otomatik eklenmez, yönetici tek tek ekler (Ç19).
      responses:
        '200':
          description: Aktifleştirildi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{userId}/reassign:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Admin]
      summary: Pasifleşen birim yöneticisinin birim yöneticiliğini yeniden ata (K5). Ticket atanmaz, açık ticket'lar patron havuzunda kalır.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_user_id]
              properties:
                to_user_id: { type: string, format: uuid }
                department_ids:
                  type: array
                  items: { type: integer }
      responses:
        '200': { description: Yeniden atandı }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/companies:
    post:
      tags: [Admin]
      summary: Şirket oluştur (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/companies/{companyId}:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Admin]
      summary: Şirket güncelle (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                is_active: { type: boolean }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      summary: Şirketi sil (yumuşak silme, deleted_at)
      responses:
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/departments:
    post:
      tags: [Admin]
      summary: Birim oluştur (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id, name]
              properties:
                company_id: { type: integer }
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/departments/{departmentId}:
    parameters:
      - { name: departmentId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Admin]
      summary: Birim güncelle (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      summary: Birimi sil (yumuşak silme, deleted_at). Birim kanalı varsa kapatılır.
      responses:
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/departments/{departmentId}/channel:
    parameters:
      - { name: departmentId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Birim kanalını aç (Ç9, sistem yöneticisi). Birim başına bir aktif kanal.
      responses:
        '201':
          description: Kanal açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Bu birimin aktif kanalı zaten var
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/locations:
    post:
      tags: [Admin]
      summary: Lokasyon oluştur (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                city: { type: string, maxLength: 120, nullable: true }
                address: { type: string, maxLength: 300, nullable: true }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/locations/{locationId}:
    parameters:
      - { name: locationId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Admin]
      summary: Lokasyon güncelle (Ç18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                city: { type: string, maxLength: 120, nullable: true }
                address: { type: string, maxLength: 300, nullable: true }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      summary: Lokasyonu sil (yumuşak silme, deleted_at)
      responses:
        '204': { description: Silindi }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/departments/{departmentId}/managers:
    parameters:
      - { name: departmentId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Birim yöneticisi ata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '201': { description: Atandı }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      summary: Birim yöneticiliğini kaldır (query ile user_id)
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Kaldırıldı }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/company-links:
    post:
      tags: [Admin]
      summary: Şirketler arası bağlantı aç. Önce önizleme için dry_run kullanılabilir.
      description: |
        company_ids iki farklı şirket içerir, sıra serbesttir. Sunucu sıralar ve yanıt company_low_id ile company_high_id döner (Ç1).
        Aynı çift için aktif bağlantı varsa 409 döner. Kapatılmış bağlantı yeniden açılırsa yeni kayıt oluşur (B6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_ids]
              properties:
                company_ids:
                  type: array
                  minItems: 2
                  maxItems: 2
                  uniqueItems: true
                  items: { type: integer }
                dry_run: { type: boolean, default: false, description: true ise yalnızca etkilenecek kullanıcıları döner }
      responses:
        '200':
          description: Önizleme (dry_run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected_users:
                    type: array
                    items: { $ref: '#/components/schemas/UserSummary' }
        '201':
          description: Bağlantı açıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyLink' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/company-links/{linkId}/revoke:
    parameters:
      - { name: linkId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Admin]
      summary: Bağlantıyı kapat (mevcut konuşmalar okunabilir kalır, yeni mesaj gönderilemez)
      responses:
        '200':
          description: Kapatıldı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyLink' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/approval-rules:
    get:
      tags: [Admin]
      summary: Onay ve hız sınırı yapılandırması (B3, tek satır)
      responses:
        '200':
          description: Yapılandırma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      summary: Yapılandırmayı güncelle. Değişiklik audit_log'a yazılır (B3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_expiry_hours: { type: integer, minimum: 1, maximum: 720 }
                access_window_hours: { type: integer, minimum: 1, maximum: 168 }
                message_rate_per_min: { type: integer, minimum: 1, maximum: 600 }
                ticket_rate_per_hour: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRules' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Değer aralık dışında
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Kimlik doğrulanamadı
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Yetki yok
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Bulunamadı (üye olmayan kullanıcıya da bu döner, K6)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Durum çakışması (ör. kapalı talep, süresi dolmuş işlem)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Hız sınırı aşıldı (K7). Retry-After saniye cinsinden döner.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorCode:
      type: string
      description: Kapalı katalog (K6). packages/core ERROR_CODES ile aynıdır.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REFRESH_TOKEN_REUSED
        - INVITATION_INVALID
        - FORBIDDEN
        - FORBIDDEN_NOT_MEMBER
        - ACCOUNT_INACTIVE
        - TARGET_INACTIVE
        - NO_COMPANY_LINK
        - COMPANY_LINK_REVOKED
        - SELF_DECISION_FORBIDDEN
        - CONTENT_NOT_VISIBLE
        - NOT_FOUND
        - CONTEXT_CHOICE_REQUIRED
        - CONTEXT_LOCKED
        - ALREADY_MEMBER
        - EDIT_WINDOW_CLOSED
        - MESSAGE_DELETED
        - REQUEST_NOT_PENDING
        - DEPARTMENT_CHANNEL_EXISTS
        - ACCESS_WINDOW_EXPIRED
        - TARGET_NOT_IN_CONVERSATION
        - REASON_TOO_SHORT
        - RATE_LIMITED

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              example: Bu konuşmanın üyesi değilsiniz.

    AuthTokens:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Saniye cinsinden (access token için 900, B4) }

    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        job_title: { type: string, nullable: true }
        role: { type: string, enum: [employee, system_admin, executive] }
        department_ids:
          type: array
          items: { type: integer }
        location_ids:
          type: array
          items: { type: integer }
        is_active: { type: boolean }
        profile_picture_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }

    UserSummary:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        job_title: { type: string, nullable: true }
        is_active: { type: boolean }

    Company:
      type: object
      properties:
        company_id: { type: integer }
        name: { type: string }
        is_active: { type: boolean }

    Department:
      type: object
      properties:
        department_id: { type: integer }
        company_id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }

    Location:
      type: object
      properties:
        location_id: { type: integer }
        name: { type: string }
        city: { type: string, nullable: true, description: Nullable (B15) }
        address: { type: string, nullable: true, description: Nullable (B15) }

    ApprovalRules:
      type: object
      description: Tek satır yapılandırma (B3)
      properties:
        request_expiry_hours: { type: integer, minimum: 1, maximum: 720, example: 72 }
        access_window_hours: { type: integer, minimum: 1, maximum: 168, example: 24 }
        message_rate_per_min: { type: integer, minimum: 1, maximum: 600, example: 60 }
        ticket_rate_per_hour: { type: integer, minimum: 1, maximum: 200, example: 20 }
        updated_at: { type: string, format: date-time }

    ConversationSummary:
      type: object
      properties:
        conversation_id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group, department] }
        name: { type: string, nullable: true }
        last_message_at: { type: string, format: date-time, nullable: true }
        unread_count: { type: integer }
        is_muted: { type: boolean }
        updated_at: { type: string, format: date-time, description: Delta için (K4) }

    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          properties:
            department_id: { type: integer, nullable: true }
            company_context_id: { type: integer, nullable: true }
            members:
              type: array
              items:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
                  joined_at: { type: string, format: date-time }
                  left_at: { type: string, format: date-time, nullable: true }
                  last_read_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Grupta yalnızca isteği yapanın kendi kaydında dolu, diğerleri null (K1). Birebirde karşı taraf için read_by_peer kullanılır (K2).

    ContextChoiceRequired:
      type: object
      required: [error, context_options]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: CONTEXT_CHOICE_REQUIRED }
            message: { type: string }
        context_options:
          type: array
          items: { type: integer }

    Message:
      type: object
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
          nullable: true
          description: Sistem mesajında null (B12)
        client_message_id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        change_seq: { type: integer, format: int64, description: Gönderim, düzenleme ve silmede artar (K4) }
        content:
          type: string
          nullable: true
          description: Silinmiş mesajda null döner
        message_type: { type: string, enum: [text, system] }
        sent_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
        edit_window_closes_at: { type: string, format: date-time, nullable: true, description: Yalnızca gönderene döner }
        read_count:
          type: integer
          nullable: true
          description: Grupta, yalnızca gönderenin kendi mesajlarında dolu (K2). mesajın gönderilmesinden sonra last_read_at değeri daha büyük olan üye sayısı.
        read_by_peer:
          type: boolean
          nullable: true
          description: Birebirde, yalnızca gönderenin kendi mesajlarında dolu (K2). Karşı taraf okuduysa true.

    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          properties:
            body:
              type: string
              nullable: true
              description: Talep eden ve patrona döner, diğerlerine null (Ç11)
            edit_window_closes_at: { type: string, format: date-time, nullable: true }
            decisions:
              type: array
              items: { $ref: '#/components/schemas/TicketDecision' }

    TicketSummary:
      type: object
      properties:
        ticket_id: { type: string, format: uuid }
        requester: { $ref: '#/components/schemas/UserSummary' }
        target_department_id: { type: integer, description: Bilgi amaçlı, karar yetkisi birime bağlı değil (K5) }
        title: { type: string }
        status: { type: string, enum: [pending, approved, rejected, withdrawn, expired] }
        reopened_from: { type: string, format: uuid, nullable: true, description: Yeniden açılmışsa önceki ticket (Ç14) }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    TicketDecision:
      type: object
      properties:
        decided_by: { $ref: '#/components/schemas/UserSummary' }
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, nullable: true }
        decided_at: { type: string, format: date-time }

    AccessRequest:
      allOf:
        - $ref: '#/components/schemas/AccessRequestSummary'
        - type: object
          properties:
            reason: { type: string }
            targets:
              type: array
              items: { $ref: '#/components/schemas/AccessRequestTarget' }
            access_expires_at: { type: string, format: date-time, nullable: true }

    AccessRequestSummary:
      type: object
      properties:
        request_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        conversation_name: { type: string, nullable: true }
        requester: { $ref: '#/components/schemas/UserSummary' }
        status: { type: string, enum: [pending, approved, rejected, withdrawn, expired] }
        reopened_from: { type: string, format: uuid, nullable: true, description: Yeniden açılmışsa önceki talep (Ç14) }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        meta:
          type: object
          description: Onaylayanın gördüğü meta veri (Ç6)
          properties:
            conversation_type: { type: string, enum: [direct, group, department] }
            conversation_name: { type: string, nullable: true }
            requester_department_ids:
              type: array
              items: { type: integer }
              description: Talep edenin birimleri
            member_count: { type: integer }
            message_count: { type: integer }
            first_message_at: { type: string, format: date-time, nullable: true }
            last_message_at: { type: string, format: date-time, nullable: true }
            reason: { type: string }
            target_department_ids:
              type: array
              items: { type: integer }

    AccessRequestTarget:
      type: object
      properties:
        department_id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        decided_by: { $ref: '#/components/schemas/UserSummary' }
        decision_basis:
          type: string
          nullable: true
          enum: [content, meta]
          description: content = patron içerikle karar verdi. meta = patron yokken sistem yöneticisi meta veriyle karar verdi. Karar verilmeden önce null (Ç21).
        decided_at: { type: string, format: date-time, nullable: true }

    CompanyLink:
      type: object
      properties:
        link_id: { type: integer }
        company_low_id: { type: integer, description: Küçük şirket kimliği (Ç1) }
        company_high_id: { type: integer, description: Büyük şirket kimliği (Ç1) }
        created_by: { $ref: '#/components/schemas/UserSummary' }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
