# Android native e2e: release APK derlenir, Linux emülatörde kurulur, Maestro akışları koşturulur.
# Yerel Windows makinede MIUI cihaz onayları ve boşluklu kullanıcı yolu nedeniyle bu akış CI'da koşar.
name: Mobil native e2e

on:
  push:
    branches: [feat/k3-k4-delta]
    paths:
      - "apps/mobile/**"
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-native-e2e.yml"
  workflow_dispatch:

jobs:
  native-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      - name: Android projesi (prebuild)
        working-directory: apps/mobile
        # Test API'si düz HTTP ile çalışır; yalnızca bu test derlemesinde cleartext'e izin verilir.
        env:
          E2E_CLEARTEXT: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Release APK (yalnızca x86_64, emülatör ile aynı mimari)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --console=plain

      - name: Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: API (PGlite, bellek içi)
        working-directory: apps/api
        run: |
          nohup npx tsx src/dev.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'content-type: application/json' -d '{}'; then break; fi
            sleep 2
          done
          curl -s -o /dev/null -w "api:%{http_code}\n" -X POST http://127.0.0.1:3000/api/v1/auth/login -H 'content-type: application/json' -d '{}'

      - name: KVM etkin
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatör ve native e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/mobile/e2e/native-ci.sh

      - name: Maestro hata ayıklama çıktıları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore
