# Yerel geliştirme ve test altyapısı: PostgreSQL 16 ve ClamAV.
#   docker compose up -d
#   TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres (apps/api) npm test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beyaz_ofis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  clamav:
    # İlk açılışta virüs veritabanını indirir; birkaç dakika sürebilir.
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
volumes:
  pgdata:
